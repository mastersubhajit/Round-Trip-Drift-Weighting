[project]
name = "rtdw"
version = "1.0.0"
description = "Round-Trip Drift Weighting against clean-label poisoning of text-to-image diffusion models"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py311"
